<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strike Zone · Admin</title>
<style>
:root{--bg:#0e1114;--panel:#161b20;--panel2:#1c2228;--line:#2a323a;--text:#e9e6db;--mut:#8d98a1;--gold:#e0b45c;--gold2:#c99a3d;--ok:#4cc38a;--bad:#ef5b5b;--r:12px}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1200px 500px at 70% -10%,#1d2630 0,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo b{font-size:24px;letter-spacing:3px;color:var(--gold);font-weight:800}
.logo span{color:var(--mut);letter-spacing:2px;font-size:12px;text-transform:uppercase}
.pills{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-size:12.5px;color:var(--mut)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.pill.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.pill.bad i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.pill.ok{color:var(--text)}.pill.bad{color:#ffb4b4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 15px;border-radius:9px;transition:.15s}
button:hover{border-color:#44505a;background:#222a31}
button.pri{background:linear-gradient(#e6bb68,#c99a3d);color:#1a1405;border-color:#e6bb68;font-weight:700}
button.pri:hover{filter:brightness(1.08)}
button.dng{color:#ff9b9b}button.dng:hover{border-color:var(--bad);background:#2a1719}
button:disabled{opacity:.5;cursor:default}
input[type=password]{font:inherit;padding:11px 13px;border-radius:9px;border:1px solid var(--line);background:#0f1317;color:var(--text);width:100%}
input[type=password]:focus{outline:2px solid #e0b45c55;border-color:var(--gold)}
#login{max-width:400px;margin:70px auto 0;text-align:center}
#login h2{margin:0 0 4px;font-size:20px}#login p{color:var(--mut);margin:0 0 16px}
#login .row{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font-weight:600}
.tab:hover{color:var(--text)}.tab.on{background:#241f12;border-color:var(--gold2);color:var(--gold)}
.tab em{font-style:normal;font-size:12px;background:#0f1317;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--mut)}
.tab.on em{color:var(--gold);border-color:#5b4a22}
#drop{border:2px dashed #3a4650;border-radius:var(--r);padding:26px 16px;text-align:center;background:var(--panel);transition:.15s;cursor:pointer}
#drop.over{border-color:var(--gold);background:#1e1a10}
#drop big{display:block;font-size:17px;font-weight:700;margin-bottom:4px}
#drop small{color:var(--mut)}
#hint{margin:10px 2px 0;color:var(--mut);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:#0f1317;color:var(--mut);cursor:pointer;font-size:12.5px;user-select:none}
.chip.on{background:#241f12;border-color:var(--gold2);color:var(--gold)}
#gsw{margin-top:12px}#gsw>b{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:6px}
#queue{display:grid;gap:8px;margin-top:12px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.q .t{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}.q .t span:last-child{color:var(--mut)}
.bar{height:6px;background:#0f1317;border-radius:99px;margin-top:7px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .15s}
.q.done .bar>i{background:var(--ok)}.q.err .bar>i{background:var(--bad)}.q.err .t span:last-child{color:#ffb4b4}
.lib-h{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 10px}
.lib-h h3{margin:0;font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.ic{width:38px;height:38px;border-radius:9px;background:#0f1317;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--gold);flex:none}
.item .nm{flex:1;min-width:0}.item .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item .nm small{color:var(--mut)}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:#235a40}.tag.warn{color:#ffcf7a;border-color:#6a5222}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.sk{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.sk .img{aspect-ratio:16/10;background:#0f1317 center/cover no-repeat;border-bottom:1px solid var(--line)}
.sk .body{padding:10px 12px;display:grid;gap:8px}
.sk .top{display:flex;justify-content:space-between;align-items:center;gap:8px}.sk .top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:28px;border:1px dashed var(--line);border-radius:var(--r)}
.savebar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#10151a;border:1px solid var(--line);border-left:4px solid var(--gold);padding:11px 16px;border-radius:10px;max-width:92vw;transition:.2s;box-shadow:0 10px 30px #0008;z-index:9}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#toast.ok{border-left-color:var(--ok)}#toast.err{border-left-color:var(--bad)}
.hide{display:none!important}
@media(max-width:560px){.logo b{font-size:20px}.tab{padding:9px 12px}}

.wrap{max-width:1100px}
.inp{font:inherit;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:#0f1317;color:var(--text);min-width:0}
.inp:focus{outline:2px solid #e0b45c55;border-color:var(--gold)}
select.inp{cursor:pointer}
.pbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pbar .inp:first-child{flex:1;min-width:210px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.stat b{display:block;font-size:24px;color:var(--gold)}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.ch{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
.ptbw{overflow-x:auto}.ptb{width:100%;border-collapse:collapse;font-size:14px}
.ptb th{text-align:left;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptb td{padding:9px 10px;border-bottom:1px solid #20272e;white-space:nowrap}.ptb tbody tr{cursor:pointer}.ptb tbody tr:hover{background:#1c2228}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
.libg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.libc{background:#0f1317;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:1px}.libc:hover{border-color:var(--gold2)}
.libc b{font-size:20px;color:var(--gold)}.libc span{font-size:13px}.libc small{color:var(--mut)}
#pm{position:fixed;inset:0;background:#000b;z-index:8;overflow:auto;padding:20px 12px}#pmc{max-width:780px;margin:0 auto}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}.sec h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}.fg label{display:grid;gap:4px;font-size:12.5px;color:var(--mut)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hlp{color:var(--mut);font-size:12.5px;margin:6px 0 0}
#fq{width:200px}
</style></head><body><div class="wrap">
<header><div class="logo"><b>STRIKE ZONE</b><span>Admin</span></div>
<div class="pills"><div class="pill" id="p1"><i></i><span>Checking…</span></div><div class="pill" id="p2"><i></i><span>Storage…</span></div><button id="lo" class="hide" style="padding:5px 12px;font-size:12.5px">Sign out</button></div></header>

<div id="login" class="card"><h2>Admin sign-in</h2><p>Enter the password set in Vercel to manage game files.</p>
<div class="row"><input id="pw" type="password" placeholder="Admin password" autocomplete="current-password"><button class="pri" id="go">Unlock</button></div></div>

<div id="app" class="hide">
 <div class="tabs" id="tabs"></div>
 <div id="drop"><big>Drop files here or click to browse</big><small style="display:block;color:var(--mut)">You can select or drop several files at once – they upload one after another</small><small id="dsm"></small><input id="fi" type="file" multiple class="hide"></div>
 <div id="hint"></div>
 <div id="gsw" class="hide"><b>New skins work on</b><div class="chips" id="gsc"></div></div>
 <div id="queue"></div>
 <div class="lib-h"><h3 id="lt"></h3><div style="display:flex;gap:8px;align-items:center"><input id="fq" class="inp hide" type="search" placeholder="Filter this list…" autocomplete="off"><button id="rf">Refresh</button></div></div>
 <div id="lib"></div>
</div>
</div><div id="pm" class="hide"><div id="pmc" class="card"></div></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/meshopt_decoder.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script>
const $=i=>document.getElementById(i);let pw='',tab='guns',FILES=[],THUMB={},THUMBO={},SKM={},OPM={},ATM={},STM={};
const TABS=[['dash','Dashboard'],['players','Players'],['guns','Guns'],['optics','Optics'],['attachments','Attachments'],['maps','Maps'],['characters','Characters'],['skins','Skins'],['outfits','Outfits'],['accessories','Accessories'],['bodies','Character skins'],['store','Store']];
const EXT={guns:['.glb','.obj'],maps:['.glb','.obj','.json'],characters:['.glb','.obj'],skins:['.png','.jpg','.jpeg','.webp'],optics:['.glb','.obj'],attachments:['.glb','.obj'],outfits:['.png','.jpg','.jpeg','.webp'],accessories:['.glb'],bodies:['.glb'],store:[],dash:[],players:[]};
const HINT={dash:'Overview of your game: player numbers, top and newest players, and what is in each file library. Use the box below to jump straight to any player by their <b>player ID</b> or username.',players:'Find a player by their <b>player ID</b> (the 8-character code on their profile) or username, then open them to change their <b>level, XP, stats and credits</b>, give or take away store items, reset their password or ban them. Players see the change after they reload the game or finish a match.',attachments:'Upload a <b>muzzle</b> (suppressor, brake…), <b>magazine</b> or <b>grip</b> model (.glb or .obj). The file name becomes its name in the loadout (a name containing "mag" or "grip" is filed under that type automatically). Below, set its <b>type</b>, the <b>stats</b> it changes, which <b>guns</b> it works on, and fine-tune its size and position. Press Save when done. Scopes and sights go in the Optics tab.',optics:'Upload a scope / sight model (.glb or .obj). The file name becomes its name in the loadout. Then set its <b>zoom</b> and <b>size</b> below and press Save. Pick the optic per gun in Loadout → Attachments.',guns:'Name the file after the gun: <b>ak</b>, <b>m4</b>, <b>awp</b>, <b>mp9</b>, <b>gl</b> or <b>de</b> (names like m4a1, glock and deagle also work).',
 maps:'The file name becomes the map name. Optional: a <b>.json</b> with the same name sets spawn points. Keep maps under ~10 MB.',
 characters:'Any file name. Upload several and each bot gets a random one.',
 skins:'PNG, JPG or WebP. Square images (512–2048 px) work best. The file name becomes the skin name.',
 outfits:'<b>Character outfits.</b> A PNG, JPG or WebP <b>texture made for the mannequin\'s UV layout</b> (the same layout as the image inside public/characters/default.glb – export that image, paint over it, upload it here). It replaces the mannequin\'s body texture. The file name becomes the outfit name. Set the price in the <b>Store</b> tab.',
 accessories:'<b>Character accessories</b> – hats, helmets, glasses, backpacks… as a <b>.glb</b> model. It is <b>fitted to the default character automatically</b>: the character is measured and the accessory is scaled and placed to match (hat on the head, glasses at eye level, backpack on the back…). The slot is guessed from the file name (hat, helmet, glasses, goggles, mask, headphones, scarf, backpack…), anything else is treated as a hat. The file name becomes the item name. Set its price and (only if needed) slot, scale and nudges in the <b>Store</b> tab.',
 bodies:'<b>Character skins</b> – a full character as a <b>.glb</b> (a suit, soldier, robot, animal…). Players pick one in <b>Character → Body skin</b> and it replaces the default mannequin for them; other players see it too. It is scaled to the same height as the default character, stood on the floor and turned to face forward automatically. <b>Best results:</b> a model that includes the whole body (head to feet) and is <b>rigged</b> – Mixamo-style bone names animate best (walking, aiming), other rigs get a simple arm / leg swing, and an un-rigged model works but just slides along without animating. Textures must be embedded in the .glb. The file name becomes the skin name. Set its price in the <b>Store</b> tab (0 = free for everyone). Accessories and the colour tint still work on top; outfit textures only fit the default body.',
 store:'Set what each item costs in <b>credits</b>. <b>0 = free for everyone.</b> <b>Hide</b> keeps the file but stops selling it. Accessories fit the character automatically; they also have an optional <b>slot</b>, <b>scale / height / forward</b> and <b>flip</b> in case one needs a nudge. Players earn credits by playing: kill +10, assist +5, win +50, loss +15. Items you haven\'t priced yet cost 100. Press Save when done.'};
const GUNS=[['ak','AK-47'],['m4','M4A4'],['awp','AWP'],['mp9','MP9'],['gl','Glock'],['de','Deagle']];
const gunId=n=>{n=String(n).toLowerCase().replace(/\.[^.]+$/,'');const t=n.split(/[^a-z0-9]+/).filter(Boolean),h=re=>t.some(x=>re.test(x));return h(/^awp/)||/awp|sniper/.test(n)?'awp':h(/^mp-?9/)||/mp9/.test(n)?'mp9':h(/^(gl|glock|g18)/)||/glock/.test(n)?'gl':h(/^(de|deagle|deserteagle)$/)||/deagle|desert.?eagle/.test(n)?'de':h(/^m4/)||/m4a|m4/.test(n)?'m4':h(/^(ak|akm)/)||/ak-?47|kalash/.test(n)?'ak':''};
const gunName=id=>(GUNS.find(g=>g[0]==id)||[])[1];
const post=(u,o)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({password:pw},o))});
const baseOf=n=>n.replace(/\.[^.]+$/,''),extOf=n=>(n.match(/\.[^.]+$/)||[''])[0].toLowerCase();
const mb=b=>(b/1048576).toFixed(b>10485760?0:1)+' MB';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tt;function toast(m,k){const t=$('toast');t.textContent=m;t.className='show '+(k||'');clearTimeout(tt);tt=setTimeout(()=>t.className='',k=='err'?6000:2800)}
function pill(id,ok,txt){const e=$(id);e.className='pill '+(ok?'ok':'bad');e.lastChild.textContent=txt}

fetch('/api/login').then(r=>r.json()).then(d=>{pill('p1',d.passwordSet,d.passwordSet?'Password set':'Password NOT set on Vercel');
 pill('p2',d.storage=='ok',d.storage=='ok'?'Storage connected':d.storage=='missing'?'Cloudflare not set up':'Storage error');
 if(d.storage=='missing')toast('Add these environment variables on Vercel, then redeploy: '+d.error+'.','err');
 else if(d.storage!='ok')toast('Storage error: '+d.error,'err')}).catch(()=>{pill('p1',false,'API unreachable');pill('p2',false,'Is this deployed on Vercel?')});

async function login(){pw=$('pw').value.trim();if(!pw)return;$('go').disabled=true;
 const r=await post('/api/login',{}),d=await r.json().catch(()=>({}));$('go').disabled=false;
 if(!r.ok){toast(d.error||'Login failed ('+r.status+')','err');return}
 try{sessionStorage.setItem('sz_apw',pw)}catch(e){}enter()}
function enter(){$('login').classList.add('hide');$('app').classList.remove('hide');$('lo').classList.remove('hide');setTab('dash');load()}
$('go').onclick=login;$('pw').onkeydown=e=>{if(e.key=='Enter')login()};

function drawTabs(){$('tabs').innerHTML='';TABS.forEach(([k,n])=>{const d=document.createElement('div');d.className='tab'+(tab==k?' on':'');d.innerHTML=n+(k=='dash'?'':' <em>'+(k=='players'?(PLAYERS?PTOTAL:'–'):FILES.filter(f=>f.path.startsWith(k+'/')).length)+'</em>');d.onclick=()=>setTab(k);$('tabs').append(d)})}
function setTab(k){tab=k;drawTabs();$('hint').innerHTML=HINT[k];$('dsm').textContent='Accepted: '+EXT[k].join('  ');$('fi').accept=EXT[k].join(',');$('lt').textContent=TABS.find(t=>t[0]==k)[1]+(['dash','players','store'].includes(k)?'':' library');$('fq').value='';$('fq').classList.toggle('hide',k=='dash'||k=='players');$('hint').style.display=HINT[k]?'':'none';$('gsw').classList.toggle('hide',k!='skins');$('drop').classList.toggle('hide',['store','dash','players'].includes(k));render()}

function chips(el,sel,onchange){el.innerHTML='';GUNS.forEach(([id,n])=>{const c=document.createElement('span');c.className='chip'+(sel.has(id)?' on':'');c.textContent=n;c.onclick=()=>{sel.has(id)?sel.delete(id):sel.add(id);c.classList.toggle('on');onchange&&onchange()};el.append(c)})}
const newSel=new Set(GUNS.map(g=>g[0]));chips($('gsc'),newSel);

async function load(){const r=await post('/api/list',{}),d=await r.json().catch(()=>({}));if(!r.ok){toast('Could not list files: '+(d.error||r.status),'err');return}
 FILES=d;try{const m=await (await fetch('/api/manifest',{cache:'no-store'})).json();THUMB={};(m.skins||[]).forEach(s=>THUMB[s.key||s.name]=s.url);THUMBO={};(m.outfits||[]).forEach(s=>THUMBO[s.key]=s.url)}catch(e){}
 try{SKM=await (await post('/api/skinmap',{})).json()||{}}catch(e){SKM={}}try{OPM=await (await post('/api/optmap',{})).json()||{}}catch(e){OPM={}}try{ATM=await (await post('/api/attmap',{})).json()||{}}catch(e){ATM={}}try{STM=await (await post('/api/storemap',{})).json()||{}}catch(e){STM={}}await loadPlayers();drawTabs();render()}
$('rf').onclick=()=>load();

function render(){render0();applyFilter()}
function render0(){const box=$('lib'),rows=FILES.filter(f=>f.path.startsWith(tab+'/'));box.innerHTML='';
 if(tab=='dash'){renderDash(box);return}
 if(tab=='players'){renderPlayers(box);return}
 if(tab=='store'){renderStore(box);return}
 if(!rows.length){box.innerHTML='<div class="empty">Nothing here yet. Drop some files above.</div>';return}
 if(tab=='skins'){const g=document.createElement('div');g.className='grid';
  rows.forEach(f=>{const nm=f.path.split('/')[1],key=baseOf(nm),sel=new Set(SKM[key]||GUNS.map(x=>x[0])),c=document.createElement('div');c.className='sk';
   const im=document.createElement('div');im.className='img';if(THUMB[key])im.style.backgroundImage='url("'+THUMB[key]+'")';
   const b=document.createElement('div');b.className='body';b.innerHTML='<div class="top"><b title="'+esc(nm)+'">'+esc(key)+'</b><button class="dng">Delete</button></div><small style="color:var(--mut)">'+mb(f.size)+' · works on</small>';
   b.querySelector('button').onclick=()=>del(f);const ch=document.createElement('div');ch.className='chips';chips(ch,sel,()=>{SKM[key]=[...sel];$('sv').disabled=false});b.append(ch);c.append(im,b);g.append(c)});
  box.append(g);const bar=document.createElement('div');bar.className='savebar';bar.innerHTML='<button class="pri" id="sv" disabled>Save skin settings</button><small style="color:var(--mut)">Choose which guns each skin can be applied to, then save.</small>';box.append(bar);
  $('sv').onclick=saveSkins;return}
 if(tab=='attachments'){const list=document.createElement('div');list.className='list';
  const SPEC={rc:['Recoil ×',.3,1.3,.05],sp:['Spread ×',.5,1.3,.05],d:['Damage ×',.7,1.3,.02],vol:['Noise ×',.05,1,.05],m:['Magazine size ×',1,3,.1],size:['Size',.4,2.5,.1],lift:['Height offset',-.1,.1,.005],fwd:['Forward / back',-.2,.2,.005]};

/* ---- read a model in the browser and decide what kind of attachment it is ---- */
const OPTK=/scope|sight|optic|holo|acog|red[-_ ]?dot|reddot|reflex|eotech|thermal|lens/;
const LABEL={muz:'Muzzle',mag:'Magazine',grip:'Grip'};
const guessT=k=>/mag|drum|clip|belt|box/i.test(k)?'mag':/grip|foregrip|handstop/i.test(k)?'grip':'muz';
function loadModel(f){return new Promise(res=>{const url=URL.createObjectURL(f),done=o=>{URL.revokeObjectURL(url);res(o)},t=setTimeout(()=>done(null),30000);
 try{if(extOf(f.name)=='.obj')new THREE.OBJLoader().load(url,o=>{clearTimeout(t);done(o)},null,()=>{clearTimeout(t);done(null)});
 else{const gl=new THREE.GLTFLoader();if(THREE.DRACOLoader){const d=new THREE.DRACOLoader();d.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/gltf/');gl.setDRACOLoader(d)}if(window.MeshoptDecoder)gl.setMeshoptDecoder(window.MeshoptDecoder);
  gl.load(url,g=>{clearTimeout(t);done(g.scene)},null,()=>{clearTimeout(t);done(null)})}}catch(e){clearTimeout(t);done(null)}})}
async function sortModel(f,n){const nm=baseOf(n).toLowerCase();
 if(OPTK.test(nm))return{type:'optic',why:'name looks like a sight'};
 if(typeof THREE=='undefined'||!THREE.GLTFLoader)return{type:guessT(nm),why:'viewer not loaded, used name'};
 const o=await loadModel(f);if(!o)return{type:guessT(nm),why:"couldn't read the shape, used name"};
 const sz=new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3()),d=[sz.x,sz.y,sz.z],L=Math.max(...d),ax=d.indexOf(L);
 if(!(L>0))return{type:guessT(nm),why:'empty model, used name'};
 const rest=d.filter((_,i)=>i!=ax).sort((p,q)=>q-p),mid=rest[0]||1e-6,thin=rest[1]||1e-6,elong=L/mid,flat=mid/thin;
 const sd=d.slice().sort((p,q)=>q-p);
 if(sd[0]/sd[1]<1.3&&sd[1]/(sd[2]||1e-6)>=1.4)return{type:'mag',why:'round and drum-shaped'};   /* two similar big sizes + one small = a disc, i.e. a drum mag */
 if(ax==1){return flat>=1.45?{type:'mag',why:'tall and flat'}:{type:'grip',why:'tall and round'}}   /* stands upright: magazine or grip */
 if(elong>=1.3)return{type:'muz',why:'long, lies along the barrel'};                               /* lies horizontal: muzzle device */
 return{type:guessT(nm),why:'shape unclear, used name'}}

 for(const {f,n,el,bar,st} of jobs){let fo=T0,r=null;
  const fail=m=>{el.classList.add('err');st.textContent=m;bar.style.width='100%';toast(n+': '+m,'err')};

  if(fo=='skins'){SKM[baseOf(n)]=[...newSel];try{await post('/api/skinmap',{map:SKM})}catch(e){}}
  if(r){if(r.type=='optic')st.textContent='Done → Optics ('+r.why+')';
   else{const k=baseOf(n),old=ATM[k]||{};ATM[k]=Object.assign({},old,{type:r.type,guns:old.guns&&old.guns.length?old.guns:GUNS.map(g=>g[0])});if(r.type=='mag'&&ATM[k].m===undefined)ATM[k].m=1.5;sorted++;st.textContent='Done → '+LABEL[r.type]+' ('+r.why+')'}}

 const libs=TABS.filter(t=>!['dash','players','store'].includes(t[0])).map(([k,n])=>{const fs=FILES.filter(f=>f.path.startsWith(k+'/'));return[k,n,fs.length,fs.reduce((s,f)=>s+f.size,0)]});
 const lc=document.createElement('div');lc.className='card';lc.style.marginTop='12px';
 lc.innerHTML='<h4 class="ch">File libraries</h4><div class="libg">'+libs.map(l=>'<div class="libc" data-t="'+l[0]+'"><b>'+l[2]+'</b><span>'+esc(l[1])+'</span><small>'+(l[3]?mb(l[3]):'empty')+'</small></div>').join('')+'</div>';
 box.append(lc);lc.querySelectorAll('.libc').forEach(e=>e.onclick=()=>setTab(e.dataset.t));
 if(!PLAYERS){const w=document.createElement('p');w.className='hlp';w.textContent='Player data could not be loaded – check the storage status at the top and press Refresh.';box.prepend(w)}}

function renderPlayers(box){
 if(!PLAYERS){box.innerHTML='<div class="empty">Could not load players. Check the storage status at the top, then press Refresh.</div>';return}
 box.append(lookupBox());
 const bar=document.createElement('div');bar.className='pbar';
 bar.innerHTML='<input class="inp" id="ps" placeholder="Filter the list by name or ID…" autocomplete="off"><select class="inp" id="pso">'+Object.keys(SORTS).map(k=>'<option value="'+k+'">'+SORTS[k][0]+'</option>').join('')+'</select>';
 box.append(bar);const tb=document.createElement('div');tb.className='card ptbw';box.append(tb);
 const ps=bar.querySelector('#ps'),so=bar.querySelector('#pso');ps.value=PQ;so.value=PSORT;
 const draw=()=>{const q=PQ.trim().toLowerCase(),rows=PLAYERS.filter(p=>!q||p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)).sort(SORTS[PSORT][1]);
  if(!rows.length){tb.innerHTML='<div class="hlp" style="text-align:center;padding:18px">'+(PLAYERS.length?'No players match.':'No players have signed up yet.')+'</div>';return}
  tb.innerHTML='<table class="ptb"><thead><tr><th>Name</th><th>Player ID</th><th>Lvl</th><th>K/D</th><th>W / L</th><th>Credits</th><th>Joined</th></tr></thead><tbody>'+rows.slice(0,150).map(prow).join('')+'</tbody></table>'+(rows.length>150?'<div class="hlp" style="padding:10px">Showing 150 of '+rows.length+' – narrow the search, or paste a player ID above.</div>':'')+(PTOTAL>PLAYERS.length?'<div class="hlp" style="padding:0 10px 10px">Only the '+PLAYERS.length+' most recently active of '+PTOTAL+' players are listed here. Use the ID box above for anyone else.</div>':'');wireRows(tb)};
 ps.oninput=()=>{PQ=ps.value;draw()};so.onchange=()=>{PSORT=so.value;draw()};draw()}

/* ---- player editor (modal) ---- */
async function openPlayer(ref){try{const d=await api2(Object.assign({a:'get'},ref));P=d.player;PO=Object.assign({},P);showEditor()}catch(e){toast(e.message,'err')}}
function closeEd(){$('pm').classList.add('hide');P=null;PO=null}
$('pm').onclick=e=>{if(e.target==$('pm'))closeEd()};document.addEventListener('keydown',e=>{if(e.key=='Escape'&&P)closeEd()});
async function act(o,msg,nums){try{const d=await api2(Object.assign({k:P.key},o));P=d.player;PO=Object.assign({},P);if(nums)fillNums();drawHead();drawItems();drawAcct();toast(msg||'Done','ok');await loadPlayers();drawTabs();if(tab=='players'||tab=='dash')render()}catch(e){toast(e.message,'err')}}
function fillNums(){$('e-lv').value=lvlOf(P.xp).level;$('e-xp').value=P.xp;NF.slice(1).forEach(k=>$('e-'+k).value=P[k]||0);xpInfo()}
function xpInfo(){const L=lvlOf(cn($('e-xp').value));$('e-lr').textContent=L.max?'Level '+MAXL+' (max)':'Level '+L.level+' · '+num(L.into)+' / '+num(L.next)+' XP into this level'}
function showEditor(){
 $('pm').classList.remove('hide');
 $('pmc').innerHTML='<div id="e-h"></div>'+
 '<div class="sec"><h4>Level &amp; XP</h4><div class="row2"><span class="hlp" style="margin:0;width:44px">Level</span><button data-lv="-10">−10</button><button data-lv="-1">−1</button><input class="inp" id="e-lv" type="number" min="1" max="'+MAXL+'" style="width:84px"><button data-lv="1">+1</button><button data-lv="10">+10</button><button data-lv="max">Max ('+MAXL+')</button></div>'+
 '<div class="row2" style="margin-top:10px"><span class="hlp" style="margin:0;width:44px">XP</span><input class="inp" id="e-xp" type="number" min="0" style="width:150px"><span class="hlp" id="e-lr" style="margin:0"></span></div>'+
 '<p class="hlp">Picking a level puts the player at the start of that level. You can also type an exact XP amount – the level follows from it.</p></div>'+
 '<div class="sec"><h4>Stats &amp; credits</h4><div class="fg">'+[['kills','Kills'],['deaths','Deaths'],['assists','Assists'],['wins','Wins'],['losses','Losses'],['coins','Credits']].map(([k,n])=>'<label>'+n+'<input class="inp" id="e-'+k+'" type="number" min="0"></label>').join('')+'</div>'+
 '<div class="row2" style="margin-top:10px"><button data-cr="100">+100 credits</button><button data-cr="1000">+1,000</button><button data-cr="10000">+10,000</button><button class="dng" id="e-rs">Zero match stats</button></div></div>'+
 '<div class="savebar"><button class="pri" id="e-save">Save changes</button><button id="e-close">Close</button><small style="color:var(--mut)">Level, XP, stats and credits are saved together with this button.</small></div>'+
 '<div class="sec"><h4>Items</h4><div id="e-items"></div></div><div class="sec"><h4>Account</h4><div id="e-acct"></div></div>';
 const lv=$('e-lv'),xp=$('e-xp');
 lv.oninput=()=>{xp.value=xpFor(lv.value);xpInfo()};lv.onchange=()=>{lv.value=Math.max(1,Math.min(MAXL,Math.floor(+lv.value)||1));xp.value=xpFor(lv.value);xpInfo()};
 xp.oninput=()=>{lv.value=lvlOf(cn(xp.value)).level;xpInfo()};
 $('pmc').querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{const d=b.dataset.lv,cur=lvlOf(cn(xp.value)).level,n=d=='max'?MAXL:Math.max(1,Math.min(MAXL,cur+(+d)));lv.value=n;xp.value=xpFor(n);xpInfo()});
 $('pmc').querySelectorAll('[data-cr]').forEach(b=>b.onclick=()=>{$('e-coins').value=cn((+$('e-coins').value||0)+(+b.dataset.cr))});
 $('e-rs').onclick=()=>['kills','deaths','assists','wins','losses'].forEach(k=>$('e-'+k).value=0);
 $('e-save').onclick=savePlayer;$('e-close').onclick=closeEd;
 fillNums();drawHead();drawItems();drawAcct()}
async function savePlayer(){const set={};NF.forEach(k=>{const v=cn($('e-'+k).value);if(v!==(PO[k]||0))set[k]=v});if(!Object.keys(set).length){toast('Nothing changed');return}await act({a:'update',set},'Saved '+P.name,true)}
function drawHead(){$('e-h').innerHTML='<h2 style="margin:0 0 4px">'+esc(P.name)+(P.banned?' <span class="tag warn">banned</span>':'')+'</h2><div class="hlp" style="margin:0">Player ID <b class="mono" style="color:var(--gold);font-size:15px">'+esc(P.id||'(assigned at their next login)')+'</b> '+(P.id?'<button id="e-copy" style="padding:3px 9px;font-size:12px">Copy</button> ':'')+'· joined '+day(P.created)+' · Level '+P.level+'</div>';
 const c=$('e-copy');if(c)c.onclick=()=>{try{navigator.clipboard.writeText(P.id);toast('Player ID copied','ok')}catch(e){toast(P.id)}}}
function drawItems(){
 const have=new Set(P.owned),all=[];[['o','outfits'],['a','accessories'],['b','bodies'],['s','skins']].forEach(([p,fo])=>FILES.filter(f=>f.path.startsWith(fo+'/')).forEach(f=>all.push(p+':'+baseOf(f.path.split('/')[1]))));
 const miss=all.filter(i=>!have.has(i)),el=$('e-items');
 el.innerHTML='<div class="hlp" style="margin:0 0 8px">Owned ('+P.owned.length+') – click one to take it away</div><div class="chips" id="e-own">'+(P.owned.length?P.owned.map(i=>'<span class="chip on" data-rm="'+esc(i)+'" title="Remove">'+esc(i.slice(2))+' <small>· '+labOf(i)+' ✕</small></span>').join(''):'<span class="hlp" style="margin:0">Nothing owned yet.</span>')+'</div>'+
 '<div class="row2" style="margin-top:12px"><select class="inp" id="e-give" style="max-width:100%">'+(miss.length?miss.map(i=>'<option value="'+esc(i)+'">'+labOf(i)+': '+esc(i.slice(2))+'</option>').join(''):'<option value="">Owns every uploaded item</option>')+'</select><button id="e-gb"'+(miss.length?'':' disabled')+'>Give item</button><button id="e-ga"'+(miss.length?'':' disabled')+'>Give all ('+miss.length+')</button><button id="e-eq" class="dng">Reset worn look</button></div>';
 el.querySelectorAll('[data-rm]').forEach(c=>c.onclick=()=>{if(confirm('Take "'+c.dataset.rm.slice(2)+'" away from '+P.name+'?'))act({a:'update',revoke:[c.dataset.rm]},'Item removed')});
 $('e-gb').onclick=()=>{const v=$('e-give').value;if(v)act({a:'update',grant:[v]},'Item given')};
 $('e-ga').onclick=()=>{if(miss.length&&confirm('Give '+P.name+' all '+miss.length+' items?'))act({a:'update',grant:miss},'Items given')};
 $('e-eq').onclick=()=>{if(confirm('Take everything off '+P.name+"'s character?"))act({a:'update',resetEquip:true},'Look reset')}}
function drawAcct(){
 const el=$('e-acct'),b=P.banned;
 el.innerHTML='<div class="row2"><input class="inp" id="e-pw" type="text" autocomplete="off" placeholder="New password (6+ characters)" style="flex:1;min-width:200px"><button id="e-pwb">Set password</button></div>'+
 '<div class="row2" style="margin-top:12px">'+(b?'<span class="tag warn" style="margin:0">Banned'+(b.reason?': '+esc(b.reason):'')+' · '+day(b.at)+'</span><button id="e-ub">Unban</button>':'<input class="inp" id="e-br" maxlength="200" placeholder="Ban reason (shown to the player)" style="flex:1;min-width:200px"><button class="dng" id="e-bb">Ban player</button>')+'</div>'+
 '<div class="row2" style="margin-top:12px"><input class="inp" id="e-dc" placeholder="Type the username to enable delete" style="flex:1;min-width:200px"><button class="dng" id="e-db" disabled>Delete account</button></div>'+
 '<p class="hlp">A banned player is refused at login and cannot sync matches. Deleting removes the account and its player ID for good.</p>';
 $('e-pwb').onclick=async()=>{const v=$('e-pw').value;if(v.length<6){toast('Password must be at least 6 characters','err');return}await act({a:'password',newPassword:v},'Password changed');if($('e-pw'))$('e-pw').value=''};
 if(b)$('e-ub').onclick=()=>act({a:'unban'},'Player unbanned');else $('e-bb').onclick=()=>{if(confirm('Ban '+P.name+'?'))act({a:'ban',reason:$('e-br').value},'Player banned')};
 $('e-dc').oninput=()=>{$('e-db').disabled=$('e-dc').value.trim().toLowerCase()!=P.key};
 $('e-db').onclick=async()=>{if(!confirm('Permanently delete '+P.name+'? This cannot be undone.'))return;try{await api2({a:'delete',k:P.key,confirm:P.name});toast('Deleted '+P.name,'ok');closeEd();await loadPlayers();drawTabs();render()}catch(e){toast(e.message,'err')}}}

/* ---- keep the admin signed in for this browser tab ---- */
$('lo').onclick=()=>{try{sessionStorage.removeItem('sz_apw')}catch(e){}location.reload()};
try{const sp=sessionStorage.getItem('sz_apw');if(sp){pw=sp;post('/api/login',{}).then(r=>{if(r.ok)enter();else{pw='';try{sessionStorage.removeItem('sz_apw')}catch(e){}}}).catch(()=>{pw=''})}}catch(e){}
</script></body></html>
